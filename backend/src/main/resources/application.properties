server.port=8080
spring.application.name=plantitas-backend
cors.allowed-origin=http://localhost:5173
spring.datasource.url=jdbc:h2:mem:plantitasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
weather.api.base-url=https://api.open-meteo.com
weather.api.connect-timeout-ms=2500
weather.api.read-timeout-ms=3500
weather.api.cache-ttl-ms=120000
weather.api.cache-precision=3
geocoding.api.base-url=https://nominatim.openstreetmap.org
geocoding.api.connect-timeout-ms=2500
geocoding.api.read-timeout-ms=3500
geocoding.api.cache-ttl-ms=300000
geocoding.api.cache-precision=3

resilience4j.retry.instances.weatherClient.max-attempts=3
resilience4j.retry.instances.weatherClient.wait-duration=500ms
resilience4j.retry.instances.weatherClient.enable-exponential-backoff=true
resilience4j.retry.instances.weatherClient.retry-exceptions=org.springframework.web.client.ResourceAccessException,java.io.IOException
resilience4j.retry.instances.weatherClient.ignore-exceptions=com.plantitas.service.WeatherData
resilience4j.retry.instances.geocodingClient.max-attempts=3
resilience4j.retry.instances.geocodingClient.wait-duration=500ms
resilience4j.retry.instances.geocodingClient.enable-exponential-backoff=true
resilience4j.retry.instances.geocodingClient.retry-exceptions=org.springframework.web.client.ResourceAccessException,java.io.IOException
